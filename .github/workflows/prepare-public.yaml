name: Prepare reviewed public source
on:
  push:
    branches: [prepare/soluble-public031]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          package-manager-cache: false
      - run: |
          corepack enable
          corepack prepare yarn@4.18.0 --activate
      - uses: calcit-lang/setup-calcit@ca701be5a471759e442aa053cd100720bbe1f09f
        with:
          tools: calcit,caps
          caps-version: "0.1.1"
          deps-file: deps.cirru
      - name: Resolve exact formal graph
        run: |
          set -euo pipefail
          test "$(calcit -v)" = 0.30.1
          caps --strict --ci
          yarn install --immutable
          caps verify --toolchain
          git diff --quiet -- deps.cirru package.json yarn.lock .yarnrc.yml
      - name: Original complete gates before edits
        run: |
          set -euo pipefail
          mkdir -p acceptance
          calcit --check-only --all-defs
          calcit fix --workflow strict --verify --format json | tee acceptance/strict-before.json | jq -e '.data.workflow.status == "passed" and .diagnostics == []'
          calcit test --require-match --format json | tee acceptance/tests-before.json
          VITE_BASE_URL=./ yarn build
      - name: Official guarded source transaction
        run: node apply-reviewed.mjs
      - name: Complete original gates after edits
        run: |
          set -euo pipefail
          calcit edit format
          test "$(git hash-object calcit.cirru)" = "$(cat acceptance/snapshot-after-blob.txt)"
          calcit --check-only --all-defs
          calcit fix --workflow strict --verify --format json | tee acceptance/strict.json | jq -e '.data.workflow.status == "passed" and .diagnostics == []'
          calcit test --require-match --format json | tee acceptance/tests.json
          VITE_BASE_URL=./ yarn build
          cp calcit.cirru acceptance/snapshot.cirru
          cp -R dist acceptance/dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: soluble-source-evidence
          path: acceptance
          if-no-files-found: error
          retention-days: 30
